services:
  - type: web
    name: frugalroute-backend
    runtime: node
    repo: https://github.com/KanishJebaMathewM/FrugalRoute
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: frugalroute-db
          property: connectionString

databases:
  - name: frugalroute-db
    plan: free
